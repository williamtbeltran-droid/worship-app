<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grace Church - Worship Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .chord { font-weight: 700; color: #2563eb; display: inline-block; position: relative; }
    .lyric-line { line-height: 2.2; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

  <!-- Navigation Bar -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center space-x-3">
      <div class="bg-blue-600 text-white font-bold px-2.5 py-1 rounded-lg text-lg">✝</div>
      <div>
        <h1 class="font-bold text-lg leading-tight">Grace Church Worship</h1>
        <p class="text-xs text-slate-400">Single Source of Truth Portal</p>
      </div>
    </div>
    <div class="flex space-x-2">
      <button onclick="switchTab('setlist')" id="nav-setlist" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-blue-600 text-white">Sunday Setlist</button>
      <button onclick="switchTab('library')" id="nav-library" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-700 text-slate-300 hover:bg-slate-600">Song Library</button>
      <button onclick="switchTab('stems')" id="nav-stems" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-700 text-slate-300 hover:bg-slate-600">Rehearsal Stems</button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 p-4 max-w-5xl mx-auto w-full">

    <!-- TAB 1: SUNDAY SETLIST & CHART VIEWER -->
    <section id="tab-setlist" class="space-y-6">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-wrap justify-between items-center gap-4">
        <div>
          <span class="bg-blue-500/10 text-blue-400 text-xs font-semibold px-2.5 py-1 rounded-full uppercase">Upcoming Lineup</span>
          <h2 class="text-2xl font-bold mt-1">Sunday Service - Oct 25</h2>
          <p class="text-xs text-slate-400">Song Leader: Sarah M. | Band Leader: David K.</p>
        </div>

        <div class="flex items-center space-x-3 bg-slate-900 p-2 rounded-lg border border-slate-700">
          <label class="text-xs font-semibold text-slate-400 uppercase">Target Key:</label>
          <select id="keySelector" onchange="changeKey(this.value)" class="bg-slate-800 border border-slate-600 text-white font-bold text-base rounded px-3 py-1 focus:outline-none focus:border-blue-500">
            <option value="C">C Major</option>
            <option value="D">D Major</option>
            <option value="E" selected>E Major (Rehearsal Key)</option>
            <option value="F">F Major</option>
            <option value="G">G Major</option>
            <option value="A">A Major
